
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Music | Download</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top left, #1e3a5f, transparent 45%),
                linear-gradient(135deg, #0f172a, #111827, #020617);
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo span {
            color: #60a5fa;
        }

        .status {
            font-size: 11px;
            color: #86efac;
            background: #14532d55;
            border: 1px solid #166534;
            padding: 7px 12px;
            border-radius: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 22px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .cover {
            width: 160px;
            height: 160px;
            margin: 0 auto 25px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            box-shadow: 0 12px 35px #2563eb55;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .artist {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .player {
            width: 100%;
            margin-bottom: 22px;
        }

        audio {
            width: 100%;
            height: 42px;
        }

        .download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            transition: 0.3s;
        }

        .download:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px #2563eb55;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
        }

        .format {
            margin-top: 18px;
            color: #94a3b8;
            font-size: 12px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
            }

            .cover {
                width: 135px;
                height: 135px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <header class="header">
            <div class="logo">♫ Lucas<span>Music</span></div>
            <div class="status">● Disponível</div>
        </header>

        <section class="card">

            <div class="cover">🎵</div>

            <h1>Ó U GÁS!</h1>

            <p class="artist">Frênesis Studio</p>

            <div class="player">
                <audio controls preload="metadata">
                    <source src="OU%20Gas.mp3" type="audio/mpeg">
                    Seu navegador não suporta áudio.
                </audio>
            </div>

            <a class="download"
               href="O U Gas.mp3"
               download="O U Gas.mp3">

                ↓ &nbsp; BAIXAR MÚSICA

            </a>

            <p class="format">
                FORMATO MP3 • DOWNLOAD GRATUITO
            </p>

        </section>

        <footer>
            © 2026 Lucas Music<br>
            Aproveite o som!
        </footer>

    </main>

</body>
</html>
